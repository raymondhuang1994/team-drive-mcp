name: validate
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 binaries are unavailable on the latest Ubuntu image.
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run setup -- --skip-config
        env:
          DF_MCP_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Verify native Windows share before full regression
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p test_network_source.py -v
        env:
          PYTHONPATH: python
          DF_MCP_TEST_SMB: '1'
      - name: Verify Windows credential publication before full regression
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p test_graph_auth.py -v
        env:
          PYTHONPATH: python
      - run: npm run test:installer
      - run: npm run test:doctor
      - run: npm run test:cloud-configure
      - run: npm run test:backend
      - run: npm test
        env:
          DF_MCP_TEST_SMB: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: npm run evaluate -- --output .local/evaluation-ci.json
      - run: npm run test:mcp
      - run: npm run test:cloud
      - run: node scripts/mcp-concurrency.mjs
      - run: npm run test:install
      - run: npm run check:public
